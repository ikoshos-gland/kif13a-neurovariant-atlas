[project]
name = "kif13a-atlas-mcp"
version = "0.1.0"
description = "Project data layer MCP server for the KIF13A NeuroVariant Atlas: pulls public data and saves it with provenance."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.12,<2",
    "biopython>=1.84",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
kif13a-atlas-mcp = "atlas_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_mcp"]
